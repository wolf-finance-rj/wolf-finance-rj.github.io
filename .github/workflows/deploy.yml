deploy:
  name: Publicar na VPS
  needs: ci
  runs-on: ubuntu-latest
  timeout-minutes: 20

  steps:
    - name: Validar configuração
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_PORT: ${{ secrets.VPS_PORT }}
        VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      run: |
        set -e

        test -n "$VPS_HOST" || {
          echo "::error::O Secret VPS_HOST não foi configurado."
          exit 1
        }

        test -n "$VPS_USER" || {
          echo "::error::O Secret VPS_USER não foi configurado."
          exit 1
        }

        test -n "$VPS_PORT" || {
          echo "::error::O Secret VPS_PORT não foi configurado."
          exit 1
        }

        test -n "$VPS_SSH_KEY" || {
          echo "::error::O Secret VPS_SSH_KEY não foi configurado."
          exit 1
        }

        test -n "$VPS_KNOWN_HOSTS" || {
          echo "::error::O Secret VPS_KNOWN_HOSTS não foi configurado."
          exit 1
        }

    - name: Configurar acesso SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      run: |
        set -e

        install -m 700 -d "$HOME/.ssh"

        printf '%s\n' "$SSH_PRIVATE_KEY" \
          > "$HOME/.ssh/id_ed25519"

        printf '%s\n' "$SSH_KNOWN_HOSTS" \
          > "$HOME/.ssh/known_hosts"

        chmod 600 "$HOME/.ssh/id_ed25519"
        chmod 600 "$HOME/.ssh/known_hosts"

    - name: Executar deploy
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        VPS_PORT: ${{ secrets.VPS_PORT }}
      run: |
        set -e

        ssh \
          -i "$HOME/.ssh/id_ed25519" \
          -o IdentitiesOnly=yes \
          -o BatchMode=yes \
          -o ConnectTimeout=15 \
          -p "$VPS_PORT" \
          "$VPS_USER@$VPS_HOST"
